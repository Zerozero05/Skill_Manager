name: Prepare v029 source
on:
  push:
    branches: [fix/v0.2.8-runtime-ui]
    paths: [.github/workflows/prepare-v029.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Resolve lock and format changed Rust source
        shell: pwsh
        working-directory: src-tauri
        run: |
          cargo metadata --format-version 1 --filter-platform x86_64-pc-windows-msvc | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Lock preparation failed' }
          cargo fmt
          if ($LASTEXITCODE -ne 0) { throw 'Formatting preparation failed' }
      - name: Archive prepared files
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('prepared-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for path in [Path('src-tauri/Cargo.toml'),Path('src-tauri/Cargo.lock'),Path('src-tauri/build.rs'),*Path('src-tauri/src').rglob('*.rs')]:
                  z.write(path,path.as_posix())
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: v029-prepared-source-${{ github.sha }}
          path: prepared-source.zip
          retention-days: 3
